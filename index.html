<html>
<head>
    <title>Smart IVR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Добредојдовте во Smart IVR</h1>
    <div id="status">Спремно за прикачување на датотеки...</div>
    <div class="mb-3">
        <form id="uploadForm" enctype="multipart/form-data">
            <label class="form-label">Month 1 Povici: </label><input type="file" name="month1_povici" required><br>
            <label class="form-label">Month 2 Povici: </label><input type="file" name="month2_povici" required><br>
            <label class="form-label">Month 3 Povici: </label><input type="file" name="month3_povici" required><br>
            <label class="form-label">Month 1 Prechki: </label><input type="file" name="month1_prechki" required><br>
            <label class="form-label">Month 2 Prechki: </label><input type="file" name="month2_prechki" required><br>
            <label class="form-label">Month 3 Prechki: </label><input type="file" name="month3_prechki" required><br>
            <label class="form-label">FTTH Ready: </label><input type="file" name="ftth_ready" required><br>
            <label class="form-label">Slabi Linii: </label><input type="file" name="slabi_linii" required><br>
            <input type="submit" value="Process">
        </form>
    </div>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('status').textContent = 'Прикачување на датотеки...';
            
            const formData = new FormData(this);
            
            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    document.getElementById('status').textContent = 'Успешно! Превземање на резултатите...';
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'results.zip';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                } else {
                    let errorText;
                    try {
                        const errorJson = await response.json();
                        errorText = JSON.stringify(errorJson);
                    } catch {
                        errorText = await response.text();
                    }

document.getElementById('status').textContent = `Error: ${errorText}`;
                }
            } catch (error) {
                document.getElementById('status').textContent = `Fetch Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
